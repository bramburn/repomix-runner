version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: repomix-runner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repomix
      POSTGRES_PASSWORD: repomix_password
      POSTGRES_DB: repomix_runner
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomix -d repomix_runner"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
